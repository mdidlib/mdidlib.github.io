
<!DOCTYPE html>
<html lang="en">
<head>

    <title>Citation Builder - MDID Digital Skills</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.5s ease-out;
        }
        .animate-slideIn {
            animation: slideIn 0.4s ease-out;
        }
        .animate-pulse-slow {
            animation: pulse 2s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useCallback, memo } = React;

        // Stable text input component to prevent re-render issues
        const StableInput = memo(({ id, initialValue, onValueChange, disabled, resultStatus, placeholder, correctValue }) => {
            const [value, setValue] = useState(initialValue);
            const inputRef = useRef(null);
            
            const handleChange = (e) => {
                const newValue = e.target.value;
                setValue(newValue);
                onValueChange(id, newValue);
            };
            
            // If this answer was correct, show the correct value and disable
            const isCorrect = resultStatus === true;
            const displayValue = isCorrect && correctValue ? correctValue : value;
            const isDisabled = disabled || isCorrect; // Disable if feedback shown OR if correct
            
            return (
                <input
                    ref={inputRef}
                    type="text"
                    value={displayValue}
                    onChange={handleChange}
                    disabled={isDisabled}
                    className={`border-b-2 bg-white px-2 py-1 text-center min-w-32 focus:outline-none focus:border-blue-500 ${
                        resultStatus === true ? 'border-green-500 bg-green-50' :
                        resultStatus === false ? 'border-red-500 bg-red-50' :
                        'border-gray-300'
                    }`}
                    placeholder={placeholder}
                />
            );
        });

        // Stable textarea component to prevent re-render issues
        const StableTextarea = memo(({ id, initialValue, onValueChange, disabled, resultStatus, placeholder }) => {
            const [value, setValue] = useState(initialValue);
            
            const handleChange = (e) => {
                const newValue = e.target.value;
                setValue(newValue);
                onValueChange(id, newValue);
            };
            
            return (
                <textarea
                    value={value}
                    onChange={handleChange}
                    disabled={disabled}
                    rows={2}
                    className={`w-full border-2 rounded-lg p-3 font-mono text-sm focus:outline-none focus:border-blue-500 ${
                        resultStatus === true ? 'border-green-500 bg-green-50' :
                        resultStatus === false ? 'border-red-500 bg-red-50' :
                        'border-gray-300'
                    }`}
                    placeholder={placeholder}
                />
            );
        });

        // Icon components
        const BookOpen = ({ className }) => (

                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>

        // Shuffle function
        const shuffleArray = (array) => {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        };

        const CitationModule = () => {

            const [currentPhase, setCurrentPhase] = useState('warmup');
            const [currentIndex, setCurrentIndex] = useState(0);
            const [selectedElements, setSelectedElements] = useState([]);
            const [score, setScore] = useState(0);
            const [showFeedback, setShowFeedback] = useState(false);
            const [attempts, setAttempts] = useState(0);
            const [shuffledElements, setShuffledElements] = useState([]);
            const [selectedAnswer, setSelectedAnswer] = useState(null);
            
            // Final challenge state - using refs to avoid re-render on every keystroke
            const finalChallengePartAInputsRef = useRef(['', '', '', '']);
            const [finalChallengePartAResults, setFinalChallengePartAResults] = useState([null, null, null, null]);
            const [finalChallengePartAAttempted, setFinalChallengePartAAttempted] = useState(false);

                },
                {
                    id: 3,

                {

                    sourceInfo: {

                },
                {
                    id: 5,
                    title: "Online News Article",
                    sourceInfo: {

                    },
                    elements: ["Wilson, James.", '"New Study Links Sleep to Memory."', "The New York Times,", "3 Mar. 2024,", "www.nytimes.com/2024/03/03/sleep-study."],
                    correct: ["Wilson, James.", '"New Study Links Sleep to Memory."', "The New York Times,", "3 Mar. 2024,", "www.nytimes.com/2024/03/03/sleep-study."],
                    explanation: "Online news: Author. \"Article Title.\" Publication Name, Date, URL. Newspaper names are italicized as containers."
                }
            ];

            // ROUND 3: Winner Takes All - Challenging citations
            const finalRound = [
                {
                    id: 1,
                    title: "Journal Article from JSTOR Database",
                    sourceInfo: {
                        Author: "Emily Park",
                        "Article Title": "Digital Literacy in Modern Classrooms",
                        Journal: "Education Review",

                    correct: ["Park, Emily.", '"Digital Literacy in Modern Classrooms."', "Education Review,", "vol. 78, no. 2,", "2024,", "pp. 45-62.", "JSTOR."],

                },
                {
                    id: 2,
                    title: "YouTube Video",
                    sourceInfo: {
                        Creator: "Crash Course",

                        Platform: "YouTube",

                {

                {

                    title: "Instagram Post",
                    sourceInfo: {
                        Username: "@NationalGeographic",

                    },

                {

                    sourceInfo: {

                    explanation: "AI citation: \"Prompt text\" prompt. Tool Name, Version, Company, Date. MLA treats the prompt as the title since AI doesn't have traditional authors."

            // ROUND 4: Bonus - Et Al. (3+ Authors)
            const bonusRound = [
                {
                    id: 1,
                    title: "Journal Article - Three Authors",
                    instruction: "When a source has 3 or more authors, list only the first author followed by 'et al.' (Latin for 'and others').",

            const bonus3Round = [
                {

                {

                                    </div>

                                    {!showFeedback && (
                                        <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                                            <h3 className="text-xl font-bold text-gray-800 mb-4">
                                                What's the problem with this citation?
                                            </h3>
                                            <div className="space-y-3">
                                                {challenge.options.map((option) => (
                                                    <button
                                                        key={option.id}
                                                        onClick={() => setSelectedAnswer(option.id)}
                                                        className={`w-full p-4 rounded-lg border-2 text-left font-medium transition-all ${
                                                            selectedAnswer === option.id
                                                                ? 'border-teal-500 bg-teal-50 text-teal-800'
                                                                : 'border-gray-200 hover:border-gray-300 hover:bg-gray-50'
                                                        }`}
                                                    >
                                                        {option.text}
                                                    </button>
                                                ))}
                                            </div>
                                            <div className="flex justify-center mt-6">
                                                <button
                                                    onClick={handleSubmit}
                                                    disabled={!selectedAnswer}
                                                    className="px-8 py-3 bg-gradient-to-r from-teal-500 to-blue-600 text-white rounded-lg font-bold hover:from-teal-600 hover:to-blue-700 transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-md"
                                                >
                                                    Check Answer
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    {/* Cooldown Feedback */}
                                    {showFeedback && (
                                        <div className="bg-white rounded-lg shadow-lg p-6 animate-fadeIn">
                                            {selectedAnswer === challenge.problem ? (
                                                <div className="text-center">
                                                    <div className="text-6xl mb-3">🎉</div>
                                                    <h3 className="text-3xl font-bold text-green-700 mb-2">Perfect!</h3>
                                                    <p className="text-lg text-gray-700 mb-4">
                                                        {attempts === 1 ? '+50 points!' : '+30 points!'}
                                                    </p>
                                                    <div className="bg-gradient-to-r from-green-50 to-teal-50 border-l-4 border-green-500 p-4 mb-6 rounded text-left">
                                                        <p className="font-semibold text-green-900 mb-2">💡 Why this works:</p>
                                                        <p className="text-gray-700">{challenge.explanation}</p>
                                                    </div>
                                                    <button
                                                        onClick={handleNext}
                                                        className="w-full bg-gradient-to-r from-green-500 to-teal-600 text-white py-3 rounded-lg font-bold hover:from-green-600 hover:to-teal-700 transition-all"
                                                    >
                                                        {currentIndex < cooldownRound.length - 1 ? '➡️ Next Challenge' : '🎯 Final Challenge!'}
                                                    </button>
                                                </div>
                                            ) : (
                                                <div className="text-center">
                                                    <div className="text-5xl mb-3">🤔</div>
                                                    <h3 className="text-2xl font-bold text-red-700 mb-2">Not Quite Right</h3>
                                                    <div className="bg-blue-50 border-l-4 border-blue-500 p-4 mb-4 rounded text-left">
                                                        <p className="font-semibold text-blue-900 mb-2">💡 The correct answer:</p>
                                                        <p className="text-gray-700">{challenge.explanation}</p>
                                                    </div>
                                                    <button
                                                        onClick={() => {
                                                            setShowFeedback(false);
                                                            setSelectedAnswer(null);
                                                        }}
                                                        className="w-full bg-gradient-to-r from-orange-500 to-red-600 text-white py-3 rounded-lg font-bold"
                                                    >
                                                        Try Again
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </>
                            )}

                            {/* FINAL CHALLENGE PHASE - Type Your Own Citations */}
                            {currentPhase === 'finalChallenge' && (
                                <>
                                    {/* Part A: In-Text Citations */}
                                    {finalChallengeSubPhase === 'partA' && (
                                        <div className="bg-white rounded-lg shadow-lg p-6 mb-6 animate-fadeIn">
                                            <h2 className="text-2xl font-bold text-gray-800 mb-2">{finalChallengeRound.partA.title}</h2>
                                            <p className="text-gray-600 mb-4">{finalChallengeRound.partA.instruction}</p>
                                            
                                            {/* Paragraph with blanks */}
                                            <div className="bg-gray-50 border-2 border-gray-200 rounded-lg p-6 mb-6">
                                                <p className="text-gray-800 leading-relaxed">
                                                    {finalChallengeRound.partA.paragraph.map((part, idx) => {
                                                        if (part.type === 'text') {
                                                            return <span key={idx}>{part.content}</span>;
                                                        } else {
                                                            return (
                                                                <span key={idx} className="inline-flex items-center mx-1">
                                                                    <span className="text-gray-500">(</span>
                                                                    <StableInput
                                                                        id={part.id}
                                                                        initialValue=""
                                                                        onValueChange={handlePartAInputChange}
                                                                        disabled={showFeedback && finalChallengePartAResults.every(r => r)}
                                                                        resultStatus={finalChallengePartAResults[part.id]}
                                                                        placeholder={`Blank ${part.id + 1}`}
                                                                        correctValue={part.correctAnswer}
                                                                    />
                                                                    <span className="text-gray-500">)</span>
                                                                    {finalChallengePartAResults[part.id] === false && (
                                                                        <span className="ml-1 text-xs text-red-600">→ {part.correctAnswer}</span>
                                                                    )}
                                                                </span>
                                                            );
                                                        }
                                                    })}
                                                </p>
                                            </div>

                                            {/* Hints - only show after first attempt with wrong answers */}
                                            {finalChallengePartAAttempted && !finalChallengePartAResults.every(r => r) && (
                                                <div className="bg-amber-50 border-2 border-amber-200 rounded-lg p-4 mb-6">
                                                    <p className="font-semibold text-amber-800 mb-2">💡 Hints for each blank:</p>
                                                    <ol className="list-decimal list-inside text-sm text-gray-700 space-y-1">
                                                        {finalChallengeRound.partA.hints.map((hint, idx) => (
                                                            <li key={idx} className={finalChallengePartAResults[idx] === false ? 'text-red-700 font-medium' : ''}>{hint}</li>
                                                        ))}
                                                    </ol>
                                                </div>
                                            )}

                                            {/* Works Cited Reference */}
                                            <div className="bg-blue-50 border-2 border-blue-200 rounded-lg p-4 mb-6">
                                                <p className="font-semibold text-blue-800 mb-2">📚 Works Cited (for reference):</p>
                                                <div className="bg-white rounded p-4 font-mono text-sm space-y-2">
                                                    {finalChallengeRound.partA.worksCited.map((entry, idx) => (
                                                        <p key={idx} className="text-gray-800" style={{ textIndent: '-1.5em', paddingLeft: '1.5em' }}>{entry}</p>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* Submit Button */}
                                            {/* Submit Button - show if not all correct yet */}
                                            {!finalChallengePartAResults.every(r => r) && (
                                                <div className="flex justify-center">
                                                    <button
                                                        onClick={() => {
                                                            // Normalize and check answers
                                                            const normalize = (str) => str.trim().replace(/[""]/g, '"').replace(/['']/g, "'");
                                                            const results = finalChallengeRound.partA.paragraph
                                                                .filter(p => p.type === 'blank')
                                                                .map((blank) => {
                                                                    // Keep previous correct answers
                                                                    if (finalChallengePartAResults[blank.id] === true) {
                                                                        return true;
                                                                    }
                                                                    const userAnswer = normalize(finalChallengePartAInputsRef.current[blank.id]);
                                                                    const correctAnswer = normalize(blank.correctAnswer);
                                                                    return userAnswer.toLowerCase() === correctAnswer.toLowerCase();
                                                                });
                                                            setFinalChallengePartAResults(results);
                                                            
                                                            // Only add score on first attempt
                                                            if (!finalChallengePartAAttempted) {
                                                                const correctCount = results.filter(r => r).length;
                                                                setScore(score + (correctCount * finalChallengeRound.partA.points));
                                                            }
                                                            setFinalChallengePartAAttempted(true);
                                                            
                                                            // Show feedback if all correct
                                                            if (results.every(r => r)) {
                                                                setShowFeedback(true);
                                                            }
                                                        }}
                                                        className="px-8 py-3 bg-gradient-to-r from-red-500 to-rose-600 text-white rounded-lg font-bold hover:from-red-600 hover:to-rose-700 transition-all shadow-md"
                                                    >
                                                        {finalChallengePartAAttempted ? 'Try Again' : 'Check All Answers'}
                                                    </button>
                                                </div>
                                            )}

                                            {/* Feedback - only show when all correct */}
                                            {finalChallengePartAResults.every(r => r) && finalChallengePartAAttempted && (
                                                <div className="mt-6">
                                                    <div className="text-center p-6 rounded-lg bg-green-50 border-2 border-green-300">
                                                        <div className="text-5xl mb-3">🎉</div>
                                                        <h3 className="text-2xl font-bold mb-2 text-green-700">
                                                            4 of 4 Correct!
                                                        </h3>
                                                        <p className="text-lg text-gray-700 mb-4">
                                                            +{4 * finalChallengeRound.partA.points} points
                                                        </p>
                                                        <button
                                                            onClick={handleNext}
                                                            className="w-full bg-gradient-to-r from-red-500 to-rose-600 text-white py-3 rounded-lg font-bold hover:from-red-600 hover:to-rose-700 transition-all"
                                                        >
                                                            Continue to Part B: Works Cited →
                                                        </button>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* Part B: Build Works Cited Entries */}
                                    {finalChallengeSubPhase === 'partB' && (
                                        <div className="bg-white rounded-lg shadow-lg p-6 mb-6 animate-fadeIn">
                                            <h2 className="text-2xl font-bold text-gray-800 mb-2">{finalChallengeRound.partB.title}</h2>
                                            <p className="text-gray-600 mb-2">{finalChallengeRound.partB.instruction}</p>
                                            <p className="text-sm text-gray-500 mb-6 italic">Tip: Use underscores for italics, like _Book Title_</p>
                                            
                                            {/* Three citation challenges */}
                                            <div className="space-y-6">
                                                {finalChallengeRound.partB.challenges.map((challenge, idx) => (
                                                    <div key={idx} className="border-2 border-gray-200 rounded-lg p-4">
                                                        <p className="font-bold text-gray-800 mb-2">
                                                            {idx + 1}. {challenge.sourceType}
                                                        </p>
                                                        <div className="bg-blue-50 rounded p-3 mb-3">
                                                            <p className="text-sm font-semibold text-blue-800 mb-1">Source Information:</p>
                                                            <div className="grid grid-cols-2 gap-1 text-sm">
                                                                {Object.entries(challenge.sourceInfo).map(([key, value]) => (
                                                                    <p key={key}><span className="font-medium">{key}:</span> {value}</p>
                                                                ))}
                                                            </div>
                                                        </div>
                                                        <StableTextarea
                                                            id={idx}
                                                            initialValue=""
                                                            onValueChange={handlePartBInputChange}
                                                            disabled={showFeedback}
                                                            resultStatus={finalChallengePartBResults[idx]}
                                                            placeholder="Type your Works Cited entry here..."
                                                        />
                                                        <p className="text-xs text-gray-500 mt-1">💡 {challenge.hint}</p>
                                                        {showFeedback && finalChallengePartBResults[idx] === false && (
                                                            <div className="mt-2 p-2 bg-red-50 rounded border border-red-200">
                                                                <p className="text-xs text-red-700 font-semibold">Correct format:</p>
                                                                <p className="text-sm text-red-800 font-mono">{challenge.correctAnswer}</p>
                                                            </div>
                                                        )}
                                                        {showFeedback && finalChallengePartBResults[idx] === true && (
                                                            <div className="mt-2 p-2 bg-green-50 rounded border border-green-200">
                                                                <p className="text-sm text-green-700 font-semibold">✓ Correct!</p>
                                                            </div>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>

                                            {/* Submit Button */}
                                            {!showFeedback && (
                                                <div className="flex justify-center mt-6">
                                                    <button
                                                        onClick={() => {
                                                            // Normalize and check answers
                                                            const normalize = (str) => str.trim()
                                                                .replace(/[""]/g, '"')
                                                                .replace(/['']/g, "'")
                                                                .replace(/\s+/g, ' ');
                                                            
                                                            const results = finalChallengeRound.partB.challenges.map((challenge, idx) => {
                                                                const userAnswer = normalize(finalChallengePartBInputsRef.current[idx]);
                                                                // Check against all acceptable answers
                                                                return challenge.acceptableAnswers.some(acceptable => 
                                                                    normalize(acceptable).toLowerCase() === userAnswer.toLowerCase()
                                                                );
                                                            });
                                                            setFinalChallengePartBResults(results);
                                                            
                                                            // Calculate score
                                                            const correctCount = results.filter(r => r).length;
                                                            setScore(score + (correctCount * finalChallengeRound.partB.points));
                                                            setShowFeedback(true);
                                                        }}
                                                        className="px-8 py-3 bg-gradient-to-r from-red-500 to-rose-600 text-white rounded-lg font-bold hover:from-red-600 hover:to-rose-700 transition-all shadow-md"
                                                    >
                                                        Check All Entries
                                                    </button>
                                                </div>
                                            )}

                                            {/* Feedback */}
                                            {showFeedback && (
                                                <div className="mt-6">
                                                    <div className={`text-center p-6 rounded-lg ${
                                                        finalChallengePartBResults.every(r => r) ? 'bg-green-50 border-2 border-green-300' : 'bg-amber-50 border-2 border-amber-300'
                                                    }`}>
                                                        <div className="text-5xl mb-3">
                                                            {finalChallengePartBResults.every(r => r) ? '🏆' : '📝'}
                                                        </div>
                                                        <h3 className={`text-2xl font-bold mb-2 ${
                                                            finalChallengePartBResults.every(r => r) ? 'text-green-700' : 'text-amber-700'
                                                        }`}>
                                                            {finalChallengePartBResults.filter(r => r).length} of 3 Correct!
                                                        </h3>
                                                        <p className="text-lg text-gray-700 mb-4">
                                                            +{finalChallengePartBResults.filter(r => r).length * finalChallengeRound.partB.points} points
                                                        </p>
                                                        <button
                                                            onClick={handleNext}
                                                            className="w-full bg-gradient-to-r from-green-500 to-teal-600 text-white py-3 rounded-lg font-bold hover:from-green-600 hover:to-teal-700 transition-all"
                                                        >
                                                            🏆 See Your Final Results!
                                                        </button>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </>
                            )}

                            {/* MLA Quick Reference */}
                            <div className="bg-gradient-to-r from-blue-50 to-indigo-50 border-2 border-blue-200 rounded-lg p-6 mt-6">
                                <p className="font-semibold text-blue-900 mb-3">📖 MLA Quick Reference:</p>
                                <div className="grid md:grid-cols-3 gap-4 text-sm">
                                    <div className="bg-white p-4 rounded-lg">
                                        <p className="font-bold text-blue-700 mb-1">Core Elements:</p>
                                        <p className="text-xs text-gray-500 mb-2 italic">(Use the elements that apply, ignore the rest)</p>
                                        <div className="text-gray-700 space-y-0.5">
                                            <p>Author.</p>
                                            <p>Title of Source.</p>
                                            <p>Title of Container,</p>
                                            <p>Contributor, Version, Number,</p>
                                            <p>Publisher, Publication Date, Location.</p>
                                            <p className="text-xs text-gray-500 mt-1">(Location = page or URL)</p>
                                        </div>
                                    </div>
                                    <div className="bg-white p-4 rounded-lg">
                                        <p className="font-bold text-blue-700 mb-2">Key Formatting:</p>
                                        <ul className="text-gray-700 space-y-1">
                                            <li>• Author: Last, First.</li>
                                            <li>• Articles: "in quotes."</li>
                                            <li>• Books/Containers: <em>Italics</em></li>
                                            <li>• Date: Day Month Year</li>
                                            <li className="text-xs text-gray-600 mt-2">• Month abbreviations: Jan., Feb., Mar., Apr., Aug., Sept., Oct., Nov., Dec.</li>
                                        </ul>
                                    </div>
                                    <div className="bg-white p-4 rounded-lg">
                                        <p className="font-bold text-pink-700 mb-2">"Et al." Rule:</p>
                                        <ul className="text-gray-700 space-y-1">
                                            <li>• 1-2 authors: List all</li>
                                            <li className="text-xs text-gray-600 ml-3">Example: Dobson, Kit, and Smaro Kamboureli.</li>
                                            <li>• 3+ authors: First author + et al.</li>
                                            <li className="text-xs text-gray-600 ml-3">Example: Smith, John, et al.</li>
                                            <li>• "et al." = "and others"</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            const CompletionScreen = () => {
                const maxScore = (warmups.length * 20) + (knockoutRound.length * 30) + (finalRound.length * 75) + (bonusRound.length * 40) + (bonus2Round.length * 50) + (bonus3Round.length * 40) + (cooldownRound.length * 50) + (4 * finalChallengeRound.partA.points) + (3 * finalChallengeRound.partB.points);
                const percentage = Math.round((score / maxScore) * 100);
                let badge, emoji, message;

                if (percentage >= 90) {
                    badge = "Citation Champion";
                    emoji = "🏆";
                    message = "Outstanding! You've mastered MLA citations!";
                } else if (percentage >= 75) {
                    badge = "Citation Expert";
                    emoji = "⭐";
                    message = "Excellent work! You really know your citations!";
                } else if (percentage >= 60) {
                    badge = "Citation Scholar";
                    emoji = "📚";
                    message = "Great job! You're getting the hang of this!";
                } else {
                    badge = "Citation Learner";
                    emoji = "✏️";
                    message = "Keep practicing! You're making progress!";
                }

                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-500 via-indigo-600 to-purple-700 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-2xl w-full animate-fadeIn">
                            <div className="text-center">
                                <div className="text-8xl mb-4 animate-pulse-slow">{emoji}</div>
                                <h1 className="text-5xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent mb-2">
                                    Challenge Complete!
                                </h1>
                                <p className="text-sm font-semibold text-blue-500 tracking-wider uppercase mb-4">
                                    MDID Digital Skills
                                </p>
                                <div className="text-7xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600 mb-4">
                                    {score}
                                </div>
                                <p className="text-gray-600 mb-2">out of {maxScore} points ({percentage}%)</p>
                                <p className="text-2xl text-gray-700 mb-6">{message}</p>
                                
                                <div className="bg-gradient-to-r from-blue-100 via-indigo-100 to-purple-100 rounded-xl p-6 mb-6 border-4 border-blue-300">
                                    <p className="text-5xl mb-2">{emoji}</p>
                                    <p className="text-xl font-bold text-gray-800 mb-1">{badge}</p>
                                </div>
                                
                                <div className="bg-gradient-to-r from-blue-50 to-indigo-50 border-l-4 border-blue-500 p-4 mb-6 text-left rounded">
                                    <p className="font-semibold text-blue-900 mb-2">🎓 What You Mastered:</p>
                                    <ul className="space-y-2 text-gray-700 text-sm">
                                        <li>✓ MLA 9 Core Elements for different source types</li>
                                        <li>✓ Books (single & multiple authors)</li>
                                        <li>✓ Journal articles and websites</li>
                                        <li>✓ Database sources (JSTOR)</li>
                                        <li>✓ Social media (TikTok, Instagram, YouTube)</li>
                                        <li>✓ AI tool citations (ChatGPT)</li>
                                        <li>✓ Using "et al." for 3+ authors</li>
                                        <li>✓ Works Cited alphabetical ordering</li>
                                        <li>✓ MLA in-text citations</li>
                                        <li>✓ Spotting citation errors</li>
                                        <li>✓ Writing in-text citations from scratch</li>
                                        <li>✓ Building complete Works Cited entries</li>
                                    </ul>
                                </div>

                                <div className="bg-yellow-50 border-2 border-yellow-300 rounded-xl p-4 mb-6">
                                    <p className="text-gray-700 text-sm">
                                        <strong className="text-yellow-700">💡 Pro Tip:</strong> When in doubt, remember the MLA core elements order: Author → Title → Container → (Other info) → Publisher → Date → Location. Use Purdue OWL for reference!
                                    </p>
                                </div>
                                
                                <div className="flex gap-4 justify-center flex-wrap">
                                    <button
                                        onClick={restart}
                                        className="bg-gradient-to-r from-blue-500 to-indigo-600 text-white px-8 py-3 rounded-xl font-bold hover:from-blue-600 hover:to-indigo-700 transform hover:scale-105 transition-all flex items-center gap-2 shadow-lg"
                                    >
                                        <RefreshCw className="w-5 h-5" />
                                        Practice Again
                                    </button>
                                    <button
                                        onClick={() => window.location.href = '/'}
                                        className="bg-gradient-to-r from-green-400 to-teal-500 text-white px-8 py-3 rounded-xl font-bold hover:from-green-500 hover:to-teal-600 transition-all transform hover:scale-105 shadow-lg"
                                    >
                                        More Modules
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div>
                    {currentScreen === 'welcome' && <WelcomeScreen />}
                    {currentScreen === 'activity' && <ActivityScreen />}
                    {currentScreen === 'completion' && <CompletionScreen />}
                </div>
            );
        };

        ReactDOM.render(<CitationModule />, document.getElementById('root'));
    </script>
</body>
</html>
